name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore native-source/tests/CodexRelay.Tests.csproj

      - name: Build
        run: dotnet build native-source/CodexRelay.csproj -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project native-source/tests/CodexRelay.Tests.csproj -c Release --no-restore
